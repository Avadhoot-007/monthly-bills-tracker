<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monthly Bills - Bill Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="top-bar">
      <!-- JavaScript changes this to "Edit Bill" when needed -->
      <h1 id="form-heading">Add Bill</h1>
      <a href="dashboard.html" class="button-link">Back to Dashboard</a>
    </div>

    <div class="form-box">
      <label for="title">Title</label>
      <input type="text" id="title" maxlength="100" />

      <label for="bill-type">Type</label>
      <select id="bill-type">
        <option value="Utilities">Utilities</option>
        <option value="Investment">Investment</option>
        <option value="Loan">Loan</option>
        <option value="Subscription">Subscription</option>
      </select>

      <label for="amount">Amount (Rs)</label>
      <input type="number" id="amount" min="0.01" step="0.01" />

      <label for="due-day">Due Day of Month (1 to 31)</label>
      <input type="number" id="due-day" min="1" max="31" />

      <label for="notes">Notes (optional)</label>
      <input type="text" id="notes" maxlength="255" />

      <!-- saveBill() is written in form.js -->
      <button id="save-button" onclick="saveBill()">Save Bill</button>

      <!-- Error message shows here -->
      <p id="form-message" class="error-text"></p>
    </div>

    <script src="form.js"></script>
  </body>
</html>
